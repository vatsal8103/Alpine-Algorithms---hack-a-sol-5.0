# configs/plate_grammar.yaml
# Single Source of Truth for Indian Number Plate Grammar, Slots, Priors and Confusion Mappings
# Conforming to CMVR 1989 (Rules 50, 51, 80, 81), GSR 594(E) (BH Series), and MoRTH Gazette S.O. 1332(E).

metadata:
  version: "2.0.0"
  description: "Probabilistic Grammar Specification for Indian Vehicle Registration Plates"
  authority: "MoRTH / CMVR 1989 / Parivahan"

# Full verified list of 36 active State & UT codes + 5 grandfathered legacy codes
state_codes:
  AN: { name: "Andaman and Nicobar Islands", status: "current", type: "UT" }
  AP: { name: "Andhra Pradesh", status: "current", type: "State" }
  AR: { name: "Arunachal Pradesh", status: "current", type: "State" }
  AS: { name: "Assam", status: "current", type: "State" }
  BR: { name: "Bihar", status: "current", type: "State" }
  CG: { name: "Chhattisgarh", status: "current", type: "State" }
  CH: { name: "Chandigarh", status: "current", type: "UT" }
  DD: { name: "Dadra and Nagar Haveli and Daman and Diu", status: "current", type: "UT", notes: "Unified code post Jan 2020 merger" }
  DL: { name: "Delhi", status: "current", type: "UT", notes: "Supports vehicle category code in RTO slot" }
  GA: { name: "Goa", status: "current", type: "State" }
  GJ: { name: "Gujarat", status: "current", type: "State" }
  HP: { name: "Himachal Pradesh", status: "current", type: "State" }
  HR: { name: "Haryana", status: "current", type: "State" }
  JH: { name: "Jharkhand", status: "current", type: "State" }
  JK: { name: "Jammu and Kashmir", status: "current", type: "UT" }
  KA: { name: "Karnataka", status: "current", type: "State" }
  KL: { name: "Kerala", status: "current", type: "State" }
  LA: { name: "Ladakh", status: "current", type: "UT", notes: "Established 2019" }
  LD: { name: "Lakshadweep", status: "current", type: "UT" }
  MH: { name: "Maharashtra", status: "current", type: "State" }
  ML: { name: "Meghalaya", status: "current", type: "State" }
  MN: { name: "Manipur", status: "current", type: "State" }
  MP: { name: "Madhya Pradesh", status: "current", type: "State" }
  MZ: { name: "Mizoram", status: "current", type: "State" }
  NL: { name: "Nagaland", status: "current", type: "State" }
  OD: { name: "Odisha", status: "current", type: "State", notes: "Official since 2012" }
  PB: { name: "Punjab", status: "current", type: "State" }
  PY: { name: "Puducherry", status: "current", type: "UT" }
  RJ: { name: "Rajasthan", status: "current", type: "State" }
  SK: { name: "Sikkim", status: "current", type: "State" }
  TG: { name: "Telangana", status: "current", type: "State", notes: "Official replacement for TS per MoRTH Gazette March 2024" }
  TN: { name: "Tamil Nadu", status: "current", type: "State" }
  TR: { name: "Tripura", status: "current", type: "State" }
  UK: { name: "Uttarakhand", status: "current", type: "State", notes: "Official replacement for UA since 2007" }
  UP: { name: "Uttar Pradesh", status: "current", type: "State" }
  WB: { name: "West Bengal", status: "current", type: "State" }

  # Grandfathered Legacy Codes (Valid on road, flagged 'legacy')
  TS: { name: "Telangana (Legacy)", status: "legacy", type: "State", notes: "Pre-March 2024 registrations" }
  UA: { name: "Uttarakhand (Legacy)", status: "legacy", type: "State", notes: "Pre-2007 registrations" }
  OR: { name: "Odisha (Legacy)", status: "legacy", type: "State", notes: "Pre-2012 registrations" }
  CT: { name: "Chhattisgarh (Legacy)", status: "legacy", type: "State", notes: "Early state abbreviation" }
  DN: { name: "Dadra and Nagar Haveli (Legacy)", status: "legacy", type: "UT", notes: "Pre-2020 merger" }

# Noise tokens stripped prior to parsing
noise_tokens:
  - "IND"
  - "INDIA"
  - "BHARAT"

# Delhi category letters allowed inside the RTO block for DL plates
delhi_category_letters:
  C: "Car / Private 4-Wheeler"
  S: "Two-Wheeler (Scooter/Motorcycle)"
  P: "Passenger Bus"
  R: "Three-Wheeler (Auto-rickshaw)"
  T: "Tourist Taxi"
  V: "Light Commercial Van"
  Y: "Commercial Private Hire"
  E: "Electric Vehicle"

# Templates defining slot sequences
# Slot types:
#   state: 2 uppercase letters (validated against state_codes)
#   rto: 1 to 2 numeric digits
#   delhi_class: 1 letter (from delhi_category_letters, only when state == DL)
#   series: 0 to 3 uppercase letters (I and O strongly penalized)
#   number: 1 to 4 numeric digits (0000 invalid)
#   bh_year: 2 numeric digits (e.g. 21 to 29)
#   bh_tag: 2 letters strictly "BH"
#   bh_series: 1 to 2 uppercase letters (excluding I and O)
templates:
  STANDARD:
    description: "Standard Civilian Vehicle Registration (CMVR 1989)"
    slots:
      - { id: "state", class: "letter", min_len: 2, max_len: 2, description: "State/UT prefix" }
      - { id: "rto", class: "digit", min_len: 1, max_len: 2, description: "District RTO code" }
      - { id: "series", class: "letter", min_len: 1, max_len: 3, description: "Alphabetical series (1-3 letters)" }
      - { id: "number", class: "digit", min_len: 4, max_len: 4, description: "Serial number (0001-9999)" }

  DELHI:
    description: "Delhi NCT Category-Coded Registration (e.g. DL 8C AF 1234)"
    slots:
      - { id: "state", class: "letter", min_len: 2, max_len: 2, required_value: "DL" }
      - { id: "rto", class: "digit", min_len: 1, max_len: 2 }
      - { id: "delhi_class", class: "delhi_class", min_len: 1, max_len: 1 }
      - { id: "series", class: "letter", min_len: 0, max_len: 2 }
      - { id: "number", class: "digit", min_len: 1, max_len: 4 }

  BHARAT:
    description: "Bharat (BH) Series National Vehicle Registration (GSR 594(E))"
    slots:
      - { id: "bh_year", class: "digit", min_len: 2, max_len: 2, description: "Registration year (e.g. 21-29)" }
      - { id: "bh_tag", class: "letter", min_len: 2, max_len: 2, required_value: "BH" }
      - { id: "number", class: "digit", min_len: 4, max_len: 4, description: "Randomized serial (0001-9999)" }
      - { id: "series", class: "letter", min_len: 1, max_len: 2, description: "Series suffix" }

# Slot Priors & Penalties (log-space or multiplicative weights)
priors:
  invalid_class_penalty: 0.001          # Strong penalty if character class violates slot mask
  unsupported_replacement_penalty: 0.0  # Zero probability for hallucinating a character not in posteriors
  series_I_penalty: 0.05                # Penalize I in series (CMVR Rule 51(8))
  series_O_penalty: 0.05                # Penalize O in series (CMVR Rule 51(8))
  number_0000_penalty: 0.0001           # Rejection penalty for serial 0000
  unknown_state_penalty: 0.01           # Penalty when 2-letter prefix is not in state table
  legacy_state_penalty: 0.95            # Minor discount for legacy state codes (valid but flagged)
  state_candidate_posterior_margin: 0.20 # Margin required to propose state correction

# Character Confusion Maps with penalty weights (confidence multiplier when swapping)
confusion_map:
  letter_to_digit:
    O: { to: "0", penalty: 0.85 }
    I: { to: "1", penalty: 0.85 }
    Z: { to: "2", penalty: 0.80 }
    S: { to: "5", penalty: 0.80 }
    B: { to: "8", penalty: 0.80 }
    G: { to: "6", penalty: 0.75 }
    Q: { to: "0", penalty: 0.70 }
    D: { to: "0", penalty: 0.75 }
    T: { to: "7", penalty: 0.70 }
    A: { to: "4", penalty: 0.70 }
  digit_to_letter:
    "0": { to: "O", penalty: 0.85 }
    "1": { to: "I", penalty: 0.85 }
    "2": { to: "Z", penalty: 0.80 }
    "5": { to: "S", penalty: 0.80 }
    "8": { to: "B", penalty: 0.80 }
    "6": { to: "G", penalty: 0.75 }
    "4": { to: "A", penalty: 0.70 }
    "7": { to: "T", penalty: 0.70 }

# Slot matching weights for Forensic Ranker / Plate Matcher
slot_matching_weights:
  state: 1.5      # State code mismatch is significant
  rto: 1.2        # RTO mismatch is moderately significant
  delhi_class: 1.2
  series: 1.0     # Series mismatch standard weight
  number: 1.4     # Number mismatch is significant
